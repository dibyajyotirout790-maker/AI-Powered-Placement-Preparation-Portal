<div class="auth-page">

  <div class="auth-card">

    <div class="auth-header">

      <div class="brand-icon">
        AI
      </div>

      <h1>Welcome Back</h1>

      <p>
        Login to your Placement Preparation Portal
      </p>

    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >

      </div>

      <div
        *ngIf="errorMessage"
        class="message error"
      >
        {{ errorMessage }}
      </div>

      <div
        *ngIf="successMessage"
        class="message success"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        class="auth-button"
        [disabled]="loading || !loginForm.valid"
      >

        {{ loading ? 'Logging in...' : 'Login' }}

      </button>

    </form>

    <div class="auth-footer">

      <span>
        Don't have an account?
      </span>

      <a routerLink="/register">
        Create Account
      </a>

    </div>

  </div>

</div>
